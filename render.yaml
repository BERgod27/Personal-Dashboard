# Render Blueprint: one free web service. The database is a free Neon Postgres
# (Render's own free Postgres is deleted after 30 days). See server/README.md.
services:
  - type: web
    name: bernardos-day
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd server && npm ci --omit=dev
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_SECRET          # encrypts saved Moodle link and SIGARRA password; never change it
        generateValue: true
      - key: CRON_SECRET         # key for the optional keep-fresh ping (/api/cron)
        generateValue: true
      - key: GOOGLE_CLIENT_ID    # Sign in with Google: OAuth client from Google Cloud (server/README.md)
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_EMAILS      # Google accounts that may sign in, comma-separated; the first is the owner
        sync: false
      - key: DATABASE_URL        # Neon connection string (postgresql://...)
        sync: false
      - key: ANTHROPIC_API_KEY   # for the Ask tutor; from console.anthropic.com (pay per use)
        sync: false
