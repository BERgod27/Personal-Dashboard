<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Bernardo's Day</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0b0b0d">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/online.css">
</head>
<body class="auth-page">
<main class="auth">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg></span>
    <span class="brand-name">Bernardo's Day</span>
  </div>
  <form id="auth-form" class="auth-card" autocomplete="on">
    <div class="auth-head">
      <h1 id="auth-title">Sign in</h1>
      <p id="auth-intro" hidden>First visit: create the account. The setup code is the SIGNUP_CODE set on the host.</p>
    </div>
    <div class="field">
      <label for="auth-user">Username</label>
      <input id="auth-user" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="auth-pass">Password</label>
      <input id="auth-pass" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="field" id="auth-code-field" hidden>
      <label for="auth-code">Setup code</label>
      <input id="auth-code" name="code" type="password" autocomplete="off">
    </div>
    <p class="auth-error" id="auth-error" role="alert"></p>
    <button class="btn primary" id="auth-submit" type="submit">Sign in</button>
  </form>
  <p class="auth-foot">Your planner, uni, workouts and meals, synced across your devices.</p>
</main>
<script src="js/login.js"></script>
</body>
</html>
